<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bev-Hub | Contract Exhibit Generator</title>
<style>
:root{--ink:#1f2e42;--navy:#1b2941;--line:#dce3eb;--sub:#68798c;--bg:#f3f6f9;--blue:#315b91}*{box-sizing:border-box}body{font:14px/1.48 Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{border:1px solid #bdc9d6;border-radius:6px;background:white;color:#22364e;padding:9px 12px;cursor:pointer;font-weight:600}button:hover{background:#edf3f9}button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}button.primary:hover{background:#314666}button.danger{color:#a12732;border-color:#edc4c8}button:disabled{opacity:.42;cursor:not-allowed}header{background:var(--navy);color:#fff;padding:14px clamp(14px,2.3vw,30px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}header strong{font-size:17px;letter-spacing:.35px}header .sub{font-size:11px;color:#bccada}header .actions{display:flex;flex-wrap:wrap;gap:7px}header button{font-size:12px}header button.primary{background:#dceafd;border-color:#dceafd;color:#192f4d}.shell{display:grid;grid-template-columns:minmax(320px,410px) minmax(0,1fr);gap:16px;max-width:1560px;margin:auto;padding:16px}.side,.main{border:1px solid var(--line);border-radius:10px;background:white;min-width:0}.side{padding:17px;max-height:calc(100vh - 97px);overflow:auto}.main{padding:18px;min-height:660px;overflow:auto}.topnav{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:13px;border-bottom:1px solid var(--line);margin-bottom:15px}.topnav button{font-size:12px;padding:7px 10px}.topnav .sel{background:var(--navy);color:white;border-color:var(--navy)}h2{font-size:18px;margin:0 0 9px}h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin:22px 0 11px;color:#485e74;border-bottom:1px solid var(--line);padding-bottom:8px}p{margin:8px 0 14px}p.hint,.muted{font-size:12px;color:var(--sub)}.field{margin:0 0 12px}.field label{display:block;margin:0 0 4px;font-size:11px;color:#43566a;font-weight:bold}.field input,.field textarea,.field select,.picker{width:100%;border:1px solid #ccd5df;border-radius:5px;padding:9px 10px;color:#172c40;background:white}.field textarea{min-height:78px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:1px solid var(--line);padding:12px;border-radius:8px;margin-bottom:10px;background:#fbfcfe}.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.bar .small{font-size:11px}.bar .name{font-weight:bold}.thin{border:0;border-top:1px solid var(--line);margin:13px 0}.pill{font-size:11px;padding:3px 8px;border:1px solid #d3dde8;background:#f1f5f9;border-radius:99px;color:#597085}.notice{background:#fff9ed;border:1px solid #eddabb;border-radius:7px;padding:12px;color:#644c2f;font-size:12px;margin:12px 0}.okay{background:#f0f7f3;border-color:#caddce;color:#365e49}.buttons{display:flex;gap:7px;flex-wrap:wrap}.material .own{display:flex;gap:10px;flex-wrap:wrap;margin:9px 0}.material .own label{font-size:11px;white-space:nowrap}.material .own input{accent-color:#213a5d}.client-item{padding:12px;border-bottom:1px solid var(--line)}.client-item.active{background:#edf3fa}.client-item:last-child{border:0}.client-item .name{font-weight:bold}.client-item .meta{font-size:11px;color:var(--sub)}.client-item .buttons{margin-top:9px}.page-paper{width:min(100%,816px);min-height:990px;margin:0 auto;border:1px solid #e1e7ee;box-shadow:0 2px 10px #25344910;background:#fff;padding:66px 66px 42px;display:flex;flex-direction:column;color:#202d3d}.page-paper h1{font-size:25px;font-weight:500;margin:0 0 2px}.page-paper .subtitle{font-size:13px;color:#67788b}.page-paper .tagline{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#7f8ea0;margin-bottom:20px}.page-paper .rule{border-top:1px solid #d5dee8;margin:20px 0}.page-paper .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:28px 0 30px}.page-paper .meta-grid div{font-size:12px}.page-paper .meta-grid b{display:inline-block;width:49%;font-size:11px;color:#6f7e8f}.page-paper .meta-grid span{font-weight:500}.page-paper h2{font-size:15px;font-weight:500;margin:22px 0 10px}.page-paper .contract-year{font-size:11px;color:#64778c}.page-paper .doc-table{width:100%;border-collapse:collapse;font-size:11px;margin:11px 0 24px}.page-paper .doc-table th{background:#eff2f6;color:#65778a;text-align:left;padding:12px 7px;font-size:10px}.page-paper .doc-table td{padding:12px 7px;border-bottom:1px solid #dbe3ea;vertical-align:top}.page-paper .matrix th{background:#1b2941;color:#fff}.page-paper .matrix td:not(:first-child){text-align:center}.page-paper .matrix td:last-child{text-align:left}.page-paper .paragraph{font-size:11px;color:#56687e;line-height:1.65}.page-paper .foot{margin-top:auto;border-top:1px solid #dce4ed;padding-top:9px;color:#98a7b8;font-size:10px;display:flex;justify-content:space-between;gap:10px}.page-paper .dsec{margin-top:17px}.page-paper .dsec b{font-size:12px}.page-paper .dsec p{font-size:11px;line-height:1.6;color:#506379;margin:4px 0}.preview-label{font-size:12px;color:#76879b;margin-bottom:14px}.page-options{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:16px 0}.page-opt{border:1px solid var(--line);border-radius:8px;padding:13px;background:#fbfcfe}.page-opt label{display:flex;gap:10px;align-items:start;cursor:pointer}.page-opt small{display:block;color:var(--sub)}.page-opt input{margin-top:3px;accent-color:#1f3d62}.note{color:#64748b;font-size:11px;margin-top:10px}.file-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0;gap:10px;font-size:12px}.frame{width:100%;min-height:690px;border:1px solid var(--line);border-radius:6px}.hidden{display:none!important}.status{color:#c8d8eb;font-size:11px}.status.warning{color:#f9d88d}@media(max-width:960px){.shell{grid-template-columns:1fr}.side{max-height:none}.page-paper{min-height:760px;padding:38px 26px}}@media(max-width:560px){.two{grid-template-columns:1fr}header .actions{width:100%}.page-paper .meta-grid{grid-template-columns:1fr}}
</style></head><body>
<header><div><strong>BEV-HUB</strong><div class="sub">Pricing &amp; Contract Exhibit Generator | A–D</div><div class="status" id="saveStatus">Local client library</div></div><div class="actions"><button id="importPricingQuote" title="Bring the last saved calculator quote into this contract">Import Saved Quote</button><button id="saveClient">Save Client</button><button id="backupClient">Download Client Backup</button><button id="restoreClient">Import Client Backup</button><button id="downloadPdf">Download Selected PDF</button><button class="primary" id="downloadZip">Download Contract Package</button></div></header>
<div class="shell"><aside class="side"><nav class="topnav" id="tabs"><button data-tab="clients">Clients</button><button data-tab="profile">Contract Setup</button><button data-tab="a">Exhibit A</button><button data-tab="b">Exhibit B</button><button data-tab="c">Exhibit C</button><button data-tab="d">Exhibit D</button><button data-tab="pages">PDF Pages</button><button data-tab="review">Review</button></nav><div id="editor"></div></aside><main class="main"><div class="preview-label" id="previewLabel">Exhibit Preview</div><section class="page-paper" id="preview"></section><section id="workspace" class="hidden"></section><iframe id="pricingFrame" class="frame hidden" title="Bev-Hub online tolling calculator" loading="lazy"></iframe></main></div>
<input type="file" id="projectFile" accept=".json,.zip" hidden><input type="file" id="quoteFile" accept=".pdf" hidden><input type="file" id="specFiles" accept=".docx,.pdf" multiple hidden><script>
'use strict';
const CALCULATOR_URL='https://bevhub-quote-tool.pages.dev/';
const STORE_KEY='bevhub-contract-clients-v1',ACTIVE_KEY='bevhub-contract-active-v1';
const defaultMaterials=['All ingredients','Cans','Ends / lids','Film','Case labels','Pallets','Slip sheets','Pallet labels','Shrink wrap','Trays','Cartons','Sleeves','Other specialty material'];
const dHeadings=['Production Scheduling','Product Supplies','Purchase Orders and Shipping','Pack-Out Requirements','Annual Volume','Shipping and Production Records'];
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const clone=x=>JSON.parse(JSON.stringify(x)), uid=()=>('c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7));
const blank=()=>({id:uid(),modified:new Date().toISOString(),profile:{customer:'',legalName:'',facility:'',effectiveDate:'',startDate:'',endDate:'',term:'',casePack:'',package:'',annualCases:''},skus:[],materials:defaultMaterials.map(name=>({name,included:true,owner:'',notes:''})),exhibitD:dHeadings.map(heading=>({heading,text:''})),bTerms:'',bSpecsNotice:'The approved detailed product specification documents for the SKUs listed above follow this Exhibit B and form part of the attached specifications.'});
let library={},activeId='',data=null,files={quote:null,specs:{}},tab='profile',selected=new Set(['A1','B1','C1','D1']),excludedPages=new Set(),db=null,saveTimer=null,attachmentsAvailable=true;
try{library=JSON.parse(localStorage.getItem(STORE_KEY)||'{}')||{}}catch{library={}}
function writeLibrary(){try{localStorage.setItem(STORE_KEY,JSON.stringify(library));localStorage.setItem(ACTIVE_KEY,activeId);$('saveStatus').textContent='Saved in this browser';$('saveStatus').classList.remove('warning');return true}catch(e){$('saveStatus').textContent='Browser storage unavailable: download a backup';$('saveStatus').classList.add('warning');return false}}
function setStatus(msg,bad=false){$('saveStatus').textContent=msg;$('saveStatus').classList.toggle('warning',bad)}
async function openDb(){return new Promise(resolve=>{if(!('indexedDB' in window)){attachmentsAvailable=false;resolve(null);return}try{const req=indexedDB.open('bevhub-exhibit-files-v1',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('docs'))req.result.createObjectStore('docs',{keyPath:'key'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>{attachmentsAvailable=false;resolve(null)}}catch{attachmentsAvailable=false;resolve(null)}})}
async function idbList(id){if(!db)return [];return await new Promise(resolve=>{const tx=db.transaction('docs','readonly'),req=tx.objectStore('docs').getAll();req.onsuccess=()=>resolve((req.result||[]).filter(x=>x.key.startsWith(id+':')));req.onerror=()=>resolve([])})}
async function idbPut(key,name,blob){if(!db){attachmentsAvailable=false;return}await new Promise((resolve,reject)=>{const tx=db.transaction('docs','readwrite');tx.objectStore('docs').put({key,name,blob});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function idbDeleteClient(id){if(!db)return;for(const r of await idbList(id))await new Promise(resolve=>{const tx=db.transaction('docs','readwrite');tx.objectStore('docs').delete(r.key);tx.oncomplete=resolve;tx.onerror=resolve})}
async function loadFiles(id){files={quote:null,specs:{}};for(const r of await idbList(id)){if(r.key===id+':quote')files.quote={name:r.name,blob:r.blob};else if(r.key.startsWith(id+':spec:'))files.specs[r.name]=r.blob}}
function ensure(){if(!data){const x=blank();activeId=x.id;data=x;library[activeId]=clone(x);writeLibrary()}}
function saveNow(){ensure();data.modified=new Date().toISOString();library[activeId]=clone(data);writeLibrary()}
function quoteCandidates(){
  let list=[];
  try {const saved=JSON.parse(localStorage.getItem('bevhubSavedQuotes')||'[]');if(Array.isArray(saved))list=saved.filter(q=>q&&q.clientName)} catch(e){console.warn('Cannot read saved quote library',e)}
  try {const latest=JSON.parse(localStorage.getItem('bevhub-last-saved-quote-for-contract')||'null');if(latest&&latest.clientName&&!list.some(q=>(q.quoteNumber||q.id)===(latest.quoteNumber||latest.id)))list.unshift(latest)} catch(e){}
  return list;
}
function importPricingQuote(silent=false){
  const choices=quoteCandidates();
  if(!choices.length){if(!silent)alert('No saved calculator quotes found in this browser. Open the Tolling Calculator and save a quote first.');return false}
  let q=choices[0];
  if(choices.length>1){
    if(silent)return false;
    const answer=prompt('Choose which saved quote to import by number:\n'+choices.map((item,i)=>(i+1)+'. '+(item.quoteNumber||'Draft')+' | '+item.clientName+' | '+(item.annualCases||'')+' cases').join('\n'),'1');
    if(answer===null)return false;
    const number=Number(answer);
    if(!Number.isInteger(number)||number<1||number>choices.length){alert('Please enter a number shown in the list.');return false}
    q=choices[number-1];
  }
  if(!data)return false;
  const sourceKey=String(q.id||q.quoteNumber||q.clientName);
  const existing=Object.values(library).find(c=>c.linkedQuoteKey===sourceKey);
  if(existing&&existing.id!==activeId){
    if(!silent&&confirm('A contract linked to this quote already exists. Open it instead?')){selectClient(existing.id);return true}
    if(silent)return false;
  }
  const populated=Boolean(data.profile.customer||data.profile.legalName||data.profile.annualCases);
  if(populated&&data.linkedQuoteKey!==sourceKey){
    if(silent||!confirm('Import '+q.clientName+' into the current contract? Customer name, can size, case pack and annual volume will be updated. Contract dates, materials and legal terms stay unchanged.'))return false;
  }
  data.profile.customer=String(q.clientName||'');
  data.profile.package=String(q.canSize||'');
  data.profile.casePack=String(q.casePack||'');
  if(q.pricingProgram==='annual')data.profile.annualCases=String(q.annualCases||'');
  data.linkedQuoteKey=sourceKey;
  data.linkedQuoteNumber=String(q.quoteNumber||'');
  saveNow();tab='profile';render();setStatus('Imported '+q.clientName+' from calculator');return true;
}
window.addEventListener('message',ev=>{
  if(ev.origin!==window.location.origin||!ev.data)return;
  if(ev.data.type==='BEVHUB_IMPORT_IF_BLANK'&&!data.profile.customer&&!data.profile.legalName&&!data.profile.annualCases)importPricingQuote(true);
  if(ev.data.type==='BEVHUB_IMPORT_SAVED_QUOTE')importPricingQuote();
});
function saveSoon(){setStatus('Saving…');clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,260)}
async function selectClient(id){if(!library[id])return;clearTimeout(saveTimer);if(data)saveNow();activeId=id;data=clone(library[id]);await loadFiles(id);selected=new Set(['A1','B1','C1','D1']);excludedPages.clear();tab='profile';writeLibrary();render()}
async function addClient(){clearTimeout(saveTimer);if(data)saveNow();const x=blank();library[x.id]=clone(x);activeId=x.id;data=x;files={quote:null,specs:{}};selected=new Set(['A1','B1','C1','D1']);excludedPages.clear();writeLibrary();tab='profile';render()}
function field(key,label,type='text'){return `<div class="field"><label for="p_${key}">${label}</label><input id="p_${key}" data-profile="${key}" type="${type}" value="${esc(data.profile[key])}"></div>`}
function skuField(i,key,label){return `<div class="field"><label>${label}</label><input data-sku="${i}" data-sku-key="${key}" value="${esc(data.skus[i][key])}"></div>`}
function warningList(){const p=data.profile,a=[];if(!p.customer)a.push('Brand / customer name is blank.');if(!p.legalName)a.push('Customer legal entity is blank.');if(!p.effectiveDate)a.push('Agreement effective date is blank.');if(!p.facility)a.push('Manufacturing facility is blank.');if(!p.annualCases || !(+p.annualCases>0))a.push('Annual volume commitment is missing.');if(!files.quote)a.push('Approved manufacturing quote PDF has not been uploaded.');const unm=data.materials.filter(x=>x.included&&!x.owner);if(unm.length)a.push(unm.length+' included Exhibit C materials are not assigned.');if(!data.skus.length)a.push('No SKUs entered for Exhibit B.');if(data.skus.some(s=>!s.name||!s.can||!s.end||!s.fill))a.push('At least one SKU has incomplete packaging specifications.');if(data.exhibitD.some(x=>x.heading&&(!x.text||!x.text.trim())))a.push('Exhibit D includes empty provisions. Complete or remove unused sections.');a.push('Confirm contractual language and product specifications with Legal and Quality before execution.');return a}
function renderEditor(){const p=data.profile;let html='';if(tab==='clients'){const arr=Object.values(library).sort((a,b)=>(b.modified||'').localeCompare(a.modified||''));html=`<h2>Saved Clients</h2><p class="hint">Customer records are saved to this browser. Download a client backup to retain information outside this device.</p><div class="buttons"><button class="primary" id="newClient">+ New blank client</button></div><hr class="thin"><div>${arr.map(v=>`<div class="client-item ${v.id===activeId?'active':''}"><div class="name">${esc(v.profile?.customer||v.profile?.legalName||'Untitled client')}</div><div class="meta">${esc(v.profile?.facility||'Facility not entered')} · ${v.modified?new Date(v.modified).toLocaleDateString():'Not saved'}</div><div class="buttons"><button data-open-client="${esc(v.id)}">Open</button><button data-backup-client="${esc(v.id)}">Save backup</button><button class="danger" data-delete-client="${esc(v.id)}">Delete</button></div></div>`).join('')}</div>`}
else if(tab==='profile'){html=`<h2>Contract Setup</h2><p class="hint">Enter shared customer and agreement information once. The exhibits automatically reference these fields.</p>${field('customer','Brand / client name')}${field('legalName','Customer legal entity')}${field('facility','Manufacturing facility / address')}<div class="two">${field('effectiveDate','Agreement effective date','date')}${field('term','Initial term (years)','number')}</div><div class="two">${field('startDate','Contract year start','date')}${field('endDate','Contract year end','date')}</div><div class="two">${field('annualCases','Year 1 cases','number')}${field('casePack','Units per case','number')}</div>${field('package','Can / package configuration')}<div class="notice">Client records do not synchronize across devices. Use <b>Download Client Backup</b> when handing work to another person or switching computers.</div>`}
else if(tab==='pricing'){html=`<h2>Pricing Calculator</h2><p class="hint">Open the existing Bev-Hub Cloudflare calculator. This is the live pricing system, not a reconstructed pricing model.</p><div class="buttons"><button id="openCalculator">Open calculator in new tab</button></div><div class="notice">The calculator does not currently transfer pricing data automatically. Generate your approved quote there and upload its PDF under Exhibit A.</div>`}
else if(tab==='a'){html=`<h2>Exhibit A | Products and Pricing</h2><p class="hint">Upload the original approved manufacturing quote PDF. It remains unchanged and is included with your client backup and contract package.</p><button id="pickQuote">Upload quote PDF</button><div class="card" style="margin-top:12px">${files.quote?`<div class="bar"><span>${esc(files.quote.name)}</span><button id="removeQuote" class="danger">Remove</button></div>`:'No quote attached.'}</div>`}
else if(tab==='b'){html=`<h2>Exhibit B | Specifications (Attached)</h2><p class="hint">Enter SKU details and attach the approved Word or PDF product specifications. Contract Setup automatically supplies the customer, date and volume.</p>${data.skus.map((s,i)=>`<div class="card"><div class="bar"><b>SKU ${i+1}</b><button class="danger" data-remove-sku="${i}">Remove</button></div>${skuField(i,'name','SKU name')}<div class="two">${skuField(i,'sku','SKU number')}${skuField(i,'fill','Target fill')}</div>${skuField(i,'can','Can specification')}${skuField(i,'end','End specification')}</div>`).join('')}<button id="addSku">+ Add SKU</button><h3>Product Specification Attachments</h3><button id="pickSpecs">Upload Word / PDF specifications</button><div style="margin:10px 0">${Object.keys(files.specs).length?Object.keys(files.specs).map(n=>`<div class="file-row"><span>${esc(n)}</span><button data-remove-spec="${encodeURIComponent(n)}">Remove</button></div>`).join(''):'No specification files attached.'}</div><div class="field"><label>Approved additional SKU / product-list language (optional)</label><textarea data-bterms>${esc(data.bTerms||'')}</textarea></div><div class="field"><label>Specification attachment statement</label><textarea data-bnotice>${esc(data.bSpecsNotice||'')}</textarea></div>`}
else if(tab==='c'){html=`<h2>Exhibit C | Product Supplies</h2><p class="hint">Include only applicable materials. Assign one responsible party; notes remain fully editable.</p>${data.materials.map((m,i)=>`<div class="card material"><div class="bar"><span class="name">${esc(m.name)}</span><div class="buttons"><label class="muted"><input data-material-include="${i}" type="checkbox" ${m.included?'checked':''}> Include</label>${i>=defaultMaterials.length?`<button data-remove-material="${i}" class="danger">Remove</button>`:''}</div></div><div class="own">${['Customer','Bev-Hub','N/A','Unassigned'].map(owner=>`<label><input type="radio" name="owner_${i}" data-material-owner="${i}" value="${owner==='Unassigned'?'':owner}" ${m.owner===(owner==='Unassigned'?'':owner)?'checked':''}> ${owner}</label>`).join('')}</div><div class="field"><label>Notes (optional)</label><input data-material-note="${i}" value="${esc(m.notes)}" placeholder="Enter or edit note"></div></div>`).join('')}<div class="two"><div class="field"><label>Custom material</label><input id="newMaterial" placeholder="Material name"></div><div style="align-self:end;margin-bottom:12px"><button id="addMaterial">+ Add material</button></div></div>`}
else if(tab==='d'){html=`<h2>Exhibit D | Scheduling, Shipping & Handling</h2><p class="hint">Use only provisions approved for this customer. These fields are intentionally blank rather than carrying GHOST-specific contract terms into a new agreement.</p>${data.exhibitD.map((v,i)=>`<div class="card"><div class="bar"><b>Section ${i+1}</b><button data-remove-d="${i}" class="danger">Remove</button></div><div class="field"><label>Section heading</label><input data-d-heading="${i}" value="${esc(v.heading)}"></div><div class="field"><label>Approved provision</label><textarea data-d-text="${i}" placeholder="Enter approved operational terms">${esc(v.text)}</textarea></div></div>`).join('')}<button id="addD">+ Add section</button>`}
else if(tab==='pages'){const pages=collectPages();pages.forEach(p=>{if(!excludedPages.has(p.key))selected.add(p.key)});html=`<h2>PDF Page Selection</h2><p class="hint">Selections use your current exhibit fields, not a saved GHOST PDF. Every selected page will appear in your downloaded A–D PDF.</p><div class="buttons"><button id="selectAll">Select all</button><button id="selectNone">Clear all</button></div><div class="page-options">${pages.map((p,i)=>`<div class="page-opt"><label><input type="checkbox" data-page-check="${p.key}" ${selected.has(p.key)?'checked':''}><span><b>${esc(p.title)}</b><small>Page ${i+1} · ${esc(p.desc)}</small></span></label></div>`).join('')}</div><button class="primary" id="downloadSelectedInline">Download Selected PDF</button><p class="note">Original uploaded quote PDFs and Word specifications are preserved separately in the contract package ZIP. They are not silently merged or modified.</p>`}
else{html=`<h2>Pre-Execution Review</h2><p class="hint">Check these items before using the exhibits as executed contract attachments.</p>${warningList().map(t=>`<div class="notice">${esc(t)}</div>`).join('')}<div class="buttons"><button id="goPages">Select PDF Pages</button><button id="goClients">Saved Clients</button></div>`}
$('editor').innerHTML=html}

function preview(){const p=data.profile;const el=$('preview'),w=$('workspace'),iframe=$('pricingFrame');el.classList.remove('hidden');w.classList.add('hidden');iframe.classList.add('hidden');let main='';const footer=`<div class="foot"><span>BEV-HUB | ${esc(p.customer||'CLIENT')}</span><span>Agreement Date: ${esc(p.effectiveDate||'____________')}</span><span>Page 1</span></div>`;

function collectPages(){const out=[];for(const which of ['A','B','C','D']){let pages=makeDoc(which);pages.forEach((p,i)=>out.push({key:which+(i+1),title:'Exhibit '+which+(pages.length>1?' | Page '+(i+1):''),desc:which==='A'?'Quote cover':which==='B'?'SKU summary':which==='C'?'Material matrix':'Operating terms',ops:p.ops}))}return out}
function buildPdf(pages){if(!pages.length)throw Error('Select at least one page');const enc=new TextEncoder(),objects=[],put=v=>(objects.push(v),objects.length),catalog=put(''),pagesId=put(''),font=put('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'),bold=put('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>'),refs=[];for(const pg of pages){let stream=pg.ops,cid=put(`<< /Length ${enc.encode(stream).length} >>\nstream\n${stream}\nendstream`);refs.push(put(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${pt} ${pH}] /Resources << /Font << /F1 ${font} 0 R /F2 ${bold} 0 R >> >> /Contents ${cid} 0 R >>`))}objects[catalog-1]=`<< /Type /Catalog /Pages ${pagesId} 0 R >>`;objects[pagesId-1]=`<< /Type /Pages /Count ${refs.length} /Kids [${refs.map(x=>x+' 0 R').join(' ')}] >>`;let body='%PDF-1.4\n',offsets=[0];for(let i=0;i<objects.length;i++){offsets.push(enc.encode(body).length);body+=`${i+1} 0 obj\n${objects[i]}\nendobj\n`}let start=enc.encode(body).length;body+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n${offsets.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')}trailer\n<< /Size ${objects.length+1} /Root ${catalog} 0 R >>\nstartxref\n${start}\n%%EOF`;return new Blob([enc.encode(body)],{type:'application/pdf'})}
function downloadSelectedPdf(){try{const pages=collectPages();pages.forEach(pg=>{if(!excludedPages.has(pg.key))selected.add(pg.key)});const chosen=pages.filter(p=>selected.has(p.key));if(!chosen.length)throw Error('Select at least one exhibit page under PDF Pages.');download('BevHub_'+slug()+'_Selected_Exhibits.pdf',buildPdf(chosen))}catch(err){alert(err.message)}}
(async()=>{db=await openDb();let remembered='';try{remembered=localStorage.getItem(ACTIVE_KEY)||''}catch{}if(remembered&&library[remembered]){activeId=remembered;data=clone(library[remembered])}else{const ids=Object.keys(library);if(ids.length){activeId=ids[0];data=clone(library[activeId])}else{data=blank();activeId=data.id;library[activeId]=clone(data);writeLibrary()}}await loadFiles(activeId);if(!data.profile.customer&&!data.profile.legalName&&!data.profile.annualCases&&quoteCandidates().length===1)importPricingQuote(true);if(!attachmentsAvailable)setStatus('Storage restricted: download backups frequently',true);render()})().catch(err=>{setStatus('Startup error: '+err.message,true);console.error(err)});
